[package]
name = "prove-fixtures"
version = "0.1.0"
edition = "2021"
publish = false
description = "Writes the /prove request fixtures the proof timing harness proves."

# Built on its own, not with the SDK: it pulls the Zolana client's tree
# crates for a one-off run.
[workspace]

[dependencies]
num-bigint = "0.4"
solana-address = "=2.6.1"
solana-signature = "=3.4.1"
zolana-client = { git = "https://github.com/helius-labs/zolana", rev = "88854ef0429d318f0b27d72e17bbce0fdc67fa70", features = ["client"] }
zolana-hasher = { git = "https://github.com/helius-labs/zolana", rev = "88854ef0429d318f0b27d72e17bbce0fdc67fa70", features = ["std"] }
zolana-interface = { git = "https://github.com/helius-labs/zolana", rev = "88854ef0429d318f0b27d72e17bbce0fdc67fa70" }
zolana-keypair = { git = "https://github.com/helius-labs/zolana", rev = "88854ef0429d318f0b27d72e17bbce0fdc67fa70" }
zolana-merkle-tree = { git = "https://github.com/helius-labs/zolana", rev = "88854ef0429d318f0b27d72e17bbce0fdc67fa70" }
zolana-transaction = { git = "https://github.com/helius-labs/zolana", rev = "88854ef0429d318f0b27d72e17bbce0fdc67fa70" }
