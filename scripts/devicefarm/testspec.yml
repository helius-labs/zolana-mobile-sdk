# AWS Device Farm custom test environment for the proof timing bench
# (scripts/test-consumer.sh bench-apk builds the app and test package).
# The instrumentation runs twice on the one install Device Farm made: the
# first run finds no keys on the device and is the fresh one, the second
# finds them and is the restart. Flutter's prints go to logcat, which is
# followed from before the first run, so no line is lost to its ring buffer.
version: 0.1
phases:
  install:
    commands:
      - echo "app and test package installed by Device Farm"
  pre_test:
    commands:
      - adb logcat -c
      - adb logcat -v raw -s flutter > $DEVICEFARM_LOG_DIR/flutter.log 2>&1 &
  test:
    commands:
      - adb shell am instrument -w -r com.example.zolana_consumer.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee $DEVICEFARM_LOG_DIR/fresh.txt
      - adb shell am instrument -w -r com.example.zolana_consumer.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee $DEVICEFARM_LOG_DIR/restart.txt
  post_test:
    commands:
      - sleep 2
      - grep -F 'ZOLANA_TIMING {' $DEVICEFARM_LOG_DIR/flutter.log > $DEVICEFARM_LOG_DIR/timing.log || true
      - wc -l $DEVICEFARM_LOG_DIR/timing.log
artifacts:
  - $DEVICEFARM_LOG_DIR
