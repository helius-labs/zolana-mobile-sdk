name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          cache: true
      # The pinned package:test runner needs frontend_server.dart.snapshot,
      # which current Dart SDKs no longer ship, so run the test file directly.
      - run: >
          dart pub get && dart analyze --no-fatal-warnings
          && dart run test/crate_hash_test.dart && dart run test/download_test.dart
        working-directory: packages/zolana_mobile/cargokit/build_tool

  min-flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: packages/zolana_mobile
      - run: flutter pub get && flutter analyze
        working-directory: packages/zolana_mobile/example

  # A pull request that changes the Rust crate has no precompiled binaries, so
  # every consumer and example build compiles it from source. sccache keeps the
  # compiler outputs between steps and, with the Go build cache, between runs.
  # Its keys include the build paths, so the consumer builds run at a fixed path
  # (ZOLANA_CONSUMER_DIR). The builds run in jobs of their own, in parallel:
  # what sccache cannot cache, such as the vendored OpenSSL build and the final
  # link, still takes minutes per build. The example jobs build release apps;
  # the emulator jobs build and run the packaged consumer.
  android:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 2500M
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        id: rust
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          cache: true
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0
      - run: echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v6
        id: native-cache
        with:
          path: |
            ${{ runner.temp }}/sccache
            ~/.cache/go-build
          key: native-tests-sccache0.18.0-go1.27.1-rust${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'packages/zolana_mobile/native/rust-gnark/go/go.sum') }}
          restore-keys: native-tests-sccache0.18.0-go1.27.1-rust${{ steps.rust.outputs.cachekey }}-
      - run: sccache --start-server
      - run: ./scripts/stage-demo-assets.sh
      - run: cargo test --workspace
      # -count=1: the restored Go build cache must not replay a test result.
      - run: go test -count=1 ./...
        working-directory: packages/zolana_mobile/native/rust-gnark/go
        env:
          ZOLANA_TEST_KEYS: ${{ github.workspace }}/packages/zolana_mobile/example/assets/proving
      - run: cargo test -p zolana-mobile proves_the_staged_request -- --ignored
      - run: cargo test -p zolana-mobile proves_a_client_request_with_the_pinned_key -- --ignored
        env:
          ZOLANA_TEST_KEY_DIR: ${{ github.workspace }}/.cache/proving
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: packages/zolana_mobile
      - if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/sccache
            ~/.cache/go-build
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

  # The device tests, and a bench: the proof timing report of every shape
  # (README, "Proof timing"), which comments on the pull request. A newer push
  # to a pull request cancels its bench; every push to main is benched.
  android-emulator:
    name: android-emulator (${{ matrix.api-level }}${{ matrix.mode == 'bench' && ', bench' || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api-level: 35, mode: device }
          - { api-level: 26, mode: device }
          - { api-level: 35, mode: bench }
    runs-on: ubuntu-latest
    concurrency:
      group: android-${{ matrix.mode }}-${{ matrix.api-level }}-${{ matrix.mode == 'bench' && github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 2500M
      ZOLANA_TIMING_DIR: ${{ github.workspace }}/.timing
      ZOLANA_TIMING_LABEL: android-api${{ matrix.api-level }}
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        id: rust
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          cache: true
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0
      - run: |
          echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"
          echo "ZOLANA_CONSUMER_DIR=$RUNNER_TEMP/consumer" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v6
        id: native-cache
        with:
          path: |
            ${{ runner.temp }}/sccache
            ~/.cache/go-build
          key: native-android-sccache0.18.0-go1.27.1-ndk-r27c-rust${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'packages/zolana_mobile/rust/Cargo.lock', 'packages/zolana_mobile/native/rust-gnark/go/go.sum') }}
          restore-keys: native-android-sccache0.18.0-go1.27.1-ndk-r27c-rust${{ steps.rust.outputs.cachekey }}-
      - run: sccache --start-server
      - run: ./scripts/stage-demo-assets.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run clean consumer (${{ matrix.mode }}) on an API ${{ matrix.api-level }} emulator
        # A green test takes 2-7 minutes after the build, a bench about 25; a
        # hung emulator fails here, not after the job's 6 hours. The bench's
        # largest keys need the memory and their images the disk.
        timeout-minutes: ${{ matrix.mode == 'bench' && 100 || 40 }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          ram-size: ${{ matrix.mode == 'bench' && '4096M' || '' }}
          disk-size: ${{ matrix.mode == 'bench' && '8G' || '' }}
          script: ZOLANA_TEST_DEVICE=emulator-5554 bash scripts/test-consumer.sh ${{ matrix.mode }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Proof timing report
        if: matrix.mode == 'bench' && (success() || failure())
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/proof-timing-ci.sh "$ZOLANA_TIMING_LABEL"
      - if: matrix.mode == 'bench' && (success() || failure())
        uses: actions/upload-artifact@v7
        with:
          name: proof-timing-android-api${{ matrix.api-level }}
          path: |
            .timing/report.json
            .timing/report.md
          if-no-files-found: ignore
      # One job of the matrix saves the cache all restore.
      - if: matrix.api-level == 35 && matrix.mode == 'device' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/sccache
            ~/.cache/go-build
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

  android-example:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 1G
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        id: rust
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          cache: true
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0
      - run: echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v6
        id: native-cache
        with:
          path: |
            ${{ runner.temp }}/sccache
            ~/.cache/go-build
          key: native-android-example-sccache0.18.0-go1.27.1-ndk-r27c-rust${{ steps.rust.outputs.cachekey }}-${{ hashFiles('packages/zolana_mobile/rust/Cargo.lock', 'packages/zolana_mobile/native/rust-gnark/go/go.sum') }}
          restore-keys: native-android-example-sccache0.18.0-go1.27.1-ndk-r27c-rust${{ steps.rust.outputs.cachekey }}-
      - run: sccache --start-server
      - run: ./scripts/stage-demo-assets.sh
      - run: flutter pub get && flutter analyze && flutter build apk --release
        working-directory: packages/zolana_mobile/example
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Check 16 KB page alignment
        run: bash scripts/check-android-page-size.sh packages/zolana_mobile/example/build/app/outputs/flutter-apk/app-release.apk
      - if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/sccache
            ~/.cache/go-build
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

  # When the release for the crate hash has the iOS binaries, cargokit builds
  # nothing: the macOS jobs then skip the compiler cache, which they would not
  # use. Flutter's debug pods build every simulator architecture unless ARCHS
  # is set, so each job builds one and checks its iOS 16 minimum: ios the
  # runner's arm64, which its simulator runs, and ios-example x86_64.
  #
  # As on Android, ios runs the device test and a bench, cancelled as there.
  ios:
    name: ios${{ matrix.mode == 'bench' && ' (bench)' || '' }}
    strategy:
      fail-fast: false
      matrix:
        mode: [device, bench]
    runs-on: macos-latest
    concurrency:
      group: ios-${{ matrix.mode }}-${{ matrix.mode == 'bench' && github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    env:
      SCCACHE_CACHE_SIZE: 1G
      SCCACHE_IDLE_TIMEOUT: "0"
      FLUTTER_XCODE_ARCHS: arm64
      ZOLANA_TIMING_DIR: ${{ github.workspace }}/.timing
      ZOLANA_TIMING_LABEL: ios-simulator
    steps:
      - uses: actions/checkout@v6
      - run: echo "ZOLANA_CONSUMER_DIR=$RUNNER_TEMP/consumer" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        id: rust
        with:
          targets: aarch64-apple-ios-sim
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          cache: true
      - name: Look for precompiled iOS binaries
        id: precompiled
        run: |
          if bash scripts/has-precompiled-ios-binaries.sh aarch64-apple-ios-sim; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.precompiled.outputs.found != 'true'
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0
      # Flutter runs the iOS build hook, and cargo in it, without RUSTC_WRAPPER;
      # cargo reads the wrapper from its configuration instead.
      - if: steps.precompiled.outputs.found != 'true'
        run: |
          mkdir -p ~/.cargo && printf '[build]\nrustc-wrapper = "sccache"\n' >> ~/.cargo/config.toml
          echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"
      - if: steps.precompiled.outputs.found != 'true'
        uses: actions/cache/restore@v6
        id: native-cache
        with:
          path: |
            ${{ runner.temp }}/sccache
            ~/Library/Caches/go-build
          key: native-ios-arm64-sccache0.18.0-go1.27.1-rust${{ steps.rust.outputs.cachekey }}-${{ hashFiles('packages/zolana_mobile/rust/Cargo.lock', 'packages/zolana_mobile/native/rust-gnark/go/go.sum') }}
          restore-keys: native-ios-arm64-sccache0.18.0-go1.27.1-rust${{ steps.rust.outputs.cachekey }}-
      - if: steps.precompiled.outputs.found != 'true'
        run: sccache --start-server
      - run: bash scripts/patch-flutter-tool.sh
      - run: ./scripts/stage-demo-assets.sh
      # The only build of the packaged consumer: `flutter test` builds it after
      # the boot. Building before the boot, or during it, makes the job slower.
      - name: Run clean consumer (${{ matrix.mode }}) on an iOS simulator
        timeout-minutes: ${{ matrix.mode == 'bench' && 130 || 85 }}
        env:
          ZOLANA_TEST_SECONDS: ${{ matrix.mode == 'bench' && 7200 || 3600 }}
        run: bash scripts/test-ios-simulator.sh ${{ matrix.mode }}
      - name: Proof timing report
        if: matrix.mode == 'bench' && (success() || failure())
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/proof-timing-ci.sh "$ZOLANA_TIMING_LABEL"
      - if: matrix.mode == 'bench' && (success() || failure())
        uses: actions/upload-artifact@v7
        with:
          name: proof-timing-ios-simulator
          path: |
            .timing/report.json
            .timing/report.md
          if-no-files-found: ignore
      - name: Check that the native library runs on iOS 16
        if: matrix.mode == 'device'
        run: |
          for archive in "$ZOLANA_CONSUMER_DIR"/consumer/.dart_tool/hooks_runner/shared/zolana_mobile/build/*/static/libmopro_flutter_bindings.a; do
            bash scripts/check-ios-minimum.sh "$archive" 16.0
          done
      # Saved after a green test, as in the Android emulator jobs.
      - if: matrix.mode == 'device' && steps.precompiled.outputs.found != 'true' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/sccache
            ~/Library/Caches/go-build
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-diagnostics-${{ matrix.mode }}
          path: ${{ runner.temp }}/ios-simulator-diagnostics
          if-no-files-found: ignore

  ios-example:
    runs-on: macos-latest
    env:
      SCCACHE_CACHE_SIZE: 1G
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        id: rust
        with:
          targets: x86_64-apple-ios
      # The oldest supported Flutter, which gives the build hook iOS 13; the
      # ios job's gives it iOS 15.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true
      - name: Look for precompiled iOS binaries
        id: precompiled
        run: |
          if bash scripts/has-precompiled-ios-binaries.sh x86_64-apple-ios; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.precompiled.outputs.found != 'true'
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0
      - if: steps.precompiled.outputs.found != 'true'
        run: |
          mkdir -p ~/.cargo && printf '[build]\nrustc-wrapper = "sccache"\n' >> ~/.cargo/config.toml
          echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"
      - if: steps.precompiled.outputs.found != 'true'
        uses: actions/cache/restore@v6
        id: native-cache
        with:
          path: |
            ${{ runner.temp }}/sccache
            ~/Library/Caches/go-build
          key: native-ios-example-x86_64-sccache0.18.0-go1.27.1-rust${{ steps.rust.outputs.cachekey }}-${{ hashFiles('packages/zolana_mobile/rust/Cargo.lock', 'packages/zolana_mobile/native/rust-gnark/go/go.sum') }}
          restore-keys: native-ios-example-x86_64-sccache0.18.0-go1.27.1-rust${{ steps.rust.outputs.cachekey }}-
      - if: steps.precompiled.outputs.found != 'true'
        run: sccache --start-server
      - run: ./scripts/stage-demo-assets.sh
      # The arm64 simulator build is the ios job's. Flutter builds with Swift
      # Package Manager by default; the second build checks an app that uses
      # CocoaPods. The build hook's outputs are cached, so it only rebuilds the
      # app.
      - run: flutter pub get && flutter build ios --simulator
        working-directory: packages/zolana_mobile/example
        env:
          FLUTTER_XCODE_ARCHS: x86_64
          FLUTTER_XCODE_ONLY_ACTIVE_ARCH: "NO"
      - run: flutter config --no-enable-swift-package-manager && flutter build ios --simulator
        working-directory: packages/zolana_mobile/example
        env:
          FLUTTER_XCODE_ARCHS: x86_64
          FLUTTER_XCODE_ONLY_ACTIVE_ARCH: "NO"
      - name: Check that the native library runs on iOS 16
        run: |
          for archive in packages/zolana_mobile/example/.dart_tool/hooks_runner/shared/zolana_mobile/build/*/static/libmopro_flutter_bindings.a; do
            bash scripts/check-ios-minimum.sh "$archive" 16.0
          done
      # App Store Connect rejects a framework whose binary needs a newer iOS
      # than its Info.plist names (ITMS-90208).
      - name: Check the iOS minimum in the framework's Info.plist
        run: |
          framework=packages/zolana_mobile/example/build/ios/iphonesimulator/Runner.app/Frameworks/mopro_flutter_bindings.framework
          bash scripts/check-ios-minimum.sh "$framework/mopro_flutter_bindings" \
            "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$framework/Info.plist")"
      - if: steps.precompiled.outputs.found != 'true' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/sccache
            ~/Library/Caches/go-build
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/check-upstream.sh

  # After each push to main, the bench reports join the history on the
  # proof-timing branch, which pull requests compare against. One push at a
  # time writes it.
  proof-timing-history:
    if: github.event_name == 'push' && !cancelled()
    needs: [android-emulator, ios]
    runs-on: ubuntu-latest
    concurrency:
      group: proof-timing-history
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      # By name into named directories: a single artifact matched by a
      # pattern is extracted without one, and the history keys reports on
      # it. A cancelled bench uploads no report.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: proof-timing-android-api35
          path: ${{ runner.temp }}/reports/proof-timing-android-api35
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: proof-timing-ios-simulator
          path: ${{ runner.temp }}/reports/proof-timing-ios-simulator
      - run: bash scripts/proof-timing-history.sh "$RUNNER_TEMP/reports"
        env:
          GH_TOKEN: ${{ github.token }}
