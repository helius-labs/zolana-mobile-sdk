name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          cache: true
      # The pinned package:test runner needs frontend_server.dart.snapshot,
      # which current Dart SDKs no longer ship, so run the test file directly.
      - run: dart pub get && dart analyze --no-fatal-warnings && dart run test/crate_hash_test.dart
        working-directory: packages/zolana_mobile/cargokit/build_tool

  min-flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: packages/zolana_mobile
      - run: flutter pub get && flutter analyze
        working-directory: packages/zolana_mobile/example

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          cache: true
      - run: ./scripts/stage-demo-assets.sh
      - run: cargo test --workspace
      - run: go test ./...
        working-directory: packages/zolana_mobile/native/rust-gnark/go
        env:
          ZOLANA_TEST_KEYS: ${{ github.workspace }}/packages/zolana_mobile/example/assets/proving
      - run: cargo test -p zolana-mobile proves_and_verifies_staged_mopro_witness -- --ignored
      - run: cargo test -p zolana-mobile proves_a_client_request_with_the_pinned_key -- --ignored
        env:
          ZOLANA_TEST_KEY_DIR: ${{ github.workspace }}/.cache/proving
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: packages/zolana_mobile
      - run: bash scripts/test-consumer.sh android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ZOLANA_TEST_DEVICE=emulator-5554 bash scripts/test-consumer.sh device
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
      - run: flutter pub get && flutter analyze && flutter build apk --release
        working-directory: packages/zolana_mobile/example
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          cache: true
      - run: bash scripts/patch-flutter-tool.sh
      - run: ./scripts/stage-demo-assets.sh
      - run: bash scripts/test-consumer.sh ios
      - name: Run clean consumer on an iOS simulator
        timeout-minutes: 85
        run: bash scripts/test-ios-simulator.sh
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-diagnostics
          path: ${{ runner.temp }}/ios-simulator-diagnostics
          if-no-files-found: ignore
      - run: flutter pub get && flutter build ios --simulator
        working-directory: packages/zolana_mobile/example

  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/check-upstream.sh
