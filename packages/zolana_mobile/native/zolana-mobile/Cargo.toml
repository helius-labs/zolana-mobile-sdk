[package]
name = "zolana-mobile"
version = "0.1.0"
description = "Flutter-facing bindings for Zolana transaction construction and local proving."
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/helius-labs/zolana-mobile-sdk"
publish = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# zopro's stage timings in the device log (the Device Farm bench).
zopro-trace = ["zopro-zolana/trace"]
default = []
flutter = ["dep:mopro-ffi", "mopro-ffi/flutter"]

[dependencies]
async-trait = "0.1"
flutter_rust_bridge = "=2.11.1"
futures-executor = "0.3"
http = "1"
hmac = "0.12"
bytemuck = "1"
mopro-ffi = { git = "https://github.com/sergeytimoshin/mopro", rev = "c1071f96fa5a28dca8e567dd3944331047450a2b", optional = true }
# Only its types: the wallet sends through the application's transport.
reqwest = { version = "0.12", default-features = false }
reqwest-middleware = "0.4"
# The prover: the request to a witness, the arithmetic (on the GPU where
# there is one), the verified proof in gnark's formats.
zopro-zolana = { git = "https://github.com/helius-labs/zk-tools.git", rev = "683c0bb3b66c059dd0c0699f44a763cecb309012" }
log = "0.4"
# The key's image, mapped (prover::load_key).
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
solana-account = "4.3"
solana-commitment-config = "3.1"
solana-instruction = "3.4"
solana-message = "4.2"
solana-rpc-client = "4.2"
solana-rpc-client-api = "4.2"
solana-transaction-error = "3.3"
solana-transaction = "4.1"
solana-transaction-status-client-types = "4.1"
serde_json = "1.0"
sha2 = "0.10"
zeroize = "1.9"
solana-address = "=2.6.1"
solana-pubkey = "=4.2.0"
solana-signature = "=3.4.1"
wincode = "=0.5.5"
zolana-hasher = { git = "https://github.com/helius-labs/zolana", rev = "ded44879b3df35482d2871bc1d0f32f2d1be2879", features = ["std"] }
zolana-interface = { git = "https://github.com/helius-labs/zolana", rev = "ded44879b3df35482d2871bc1d0f32f2d1be2879", features = ["borsh"] }
zolana-keypair = { git = "https://github.com/helius-labs/zolana", rev = "ded44879b3df35482d2871bc1d0f32f2d1be2879" }
zolana-program = { git = "https://github.com/helius-labs/zolana", rev = "ded44879b3df35482d2871bc1d0f32f2d1be2879" }
zolana-api = { git = "https://github.com/helius-labs/zolana", rev = "ded44879b3df35482d2871bc1d0f32f2d1be2879" }
zolana-client = { git = "https://github.com/helius-labs/zolana", rev = "ded44879b3df35482d2871bc1d0f32f2d1be2879", features = ["client"] }
zolana-transaction = { git = "https://github.com/helius-labs/zolana", rev = "ded44879b3df35482d2871bc1d0f32f2d1be2879" }
zolana-user-registry-interface = { git = "https://github.com/helius-labs/zolana", rev = "ded44879b3df35482d2871bc1d0f32f2d1be2879" }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
zopro-zolana = { git = "https://github.com/helius-labs/zk-tools.git", rev = "683c0bb3b66c059dd0c0699f44a763cecb309012", features = ["metal"] }

[target.'cfg(target_os = "ios")'.dependencies]
oslog = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
zopro-zolana = { git = "https://github.com/helius-labs/zk-tools.git", rev = "683c0bb3b66c059dd0c0699f44a763cecb309012", features = ["wgpu"] }

[dev-dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
solana-keypair = "3"
solana-signer = "3.0"

[[bin]]
name = "flutter"
path = "src/bin/flutter.rs"
required-features = ["flutter"]

# The frb attribute macro leaves a `cfg(frb_expand)` behind.
[lints.rust.unexpected_cfgs]
check-cfg = ["cfg(frb_expand)"]
level = "warn"
