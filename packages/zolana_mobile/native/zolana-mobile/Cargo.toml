[package]
name = "zolana-mobile"
version = "0.1.0"
description = "Flutter-facing bindings for Zolana transaction construction and local proving."
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/helius-labs/zolana-mobile-sdk"
publish = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
flutter = ["dep:mopro-ffi", "mopro-ffi/flutter"]

[dependencies]
getrandom = "0.3"
mopro-ffi = { git = "https://github.com/sergeytimoshin/mopro", rev = "c1071f96fa5a28dca8e567dd3944331047450a2b", optional = true }
rust-gnark = { path = "../rust-gnark" }
serde_json = "1.0"
zeroize = "1.9"
solana-address = "=2.6.1"
solana-pubkey = "=4.2.0"
solana-signature = "=3.4.1"
wincode = "=0.5.5"
zolana-hasher = { git = "https://github.com/helius-labs/zolana", rev = "e6139f658c6961101d716e107a15a5ca9cecd143", features = ["std"] }
zolana-keypair = { git = "https://github.com/helius-labs/zolana", rev = "e6139f658c6961101d716e107a15a5ca9cecd143" }
zolana-transaction = { git = "https://github.com/helius-labs/zolana", rev = "e6139f658c6961101d716e107a15a5ca9cecd143" }

[[bin]]
name = "flutter"
path = "src/bin/flutter.rs"
required-features = ["flutter"]
