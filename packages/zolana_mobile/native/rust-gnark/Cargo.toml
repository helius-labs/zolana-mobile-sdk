[package]
name = "rust-gnark"
version = "0.0.3"
edition = "2021"
license = "MIT AND Apache-2.0"
repository = "https://github.com/FluxePay/rust-gnark"
description = "Rust bindings for the gnark Groth16 BN254 proving system"
build = "crates/build.rs"
include = ["crates/**", "go/**", "Cargo.toml", "*.md", "LICENSE"]

[workspace]

[lib]
path = "crates/src/lib.rs"

[dependencies]
anyhow = "1.0"

[build-dependencies]
bindgen = "0.70"
